# PennCloud coordinator configuration
# Format: node <id> <host> <port>
#         tablet <name> <row_start> <row_end> <node_id1> [node_id2] [node_id3]
#
# For single-node development (Phase 1):
# Leave this file empty or comment everything out.
# Coordinator defaults to one node at 127.0.0.1:5000.
#
# For 3-node replication (Phase 2):
# node node1 127.0.0.1 5001
# node node2 127.0.0.1 5002
# node node3 127.0.0.1 5003
# tablet tablet_aa_am aa am node1 node2 node3
# tablet tablet_an_zz an   node1 node2 node3
