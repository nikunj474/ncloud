# node <id> <host> <kv_port> <repl_port>
node node1 127.0.0.1 5500 5600
node node2 127.0.0.1 5501 5601
node node3 127.0.0.1 5502 5602

# tablet <tablet_id> <row_start> <row_end> <replica1> <replica2> ...
# Rows starting with a..m go to tabletA, rows starting with n..z go to tabletB.
# Using half-open ranges [start, end).
tablet tabletA a n node1 node2 node3
tablet tabletB n zzzzz node1 node2 node3
